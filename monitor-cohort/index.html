een);color:var(--text)}.content{max-width:1540px;padding:38px 44px 90px;margin:auto}section{scroll-margin-top:85px;margin-bottom:66px}.eyebrow{color:var(--green);font:600 11px/1.2 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}h1{font-size:clamp(34px,5vw,64px);line-height:1.04;letter-spacing:-.045em;margin:10px 0 16px}h2{font-size:28px;letter-spacing:-.03em;margin:0 0 9px}h3{font-size:16px;margin:0 0 5px}.lead{font-size:18px;color:var(--muted);max-width:860px;margin:0}.grid{display:grid;gap:14px}.four{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:18px}.card p{margin:5px 0 0;color:var(--muted)}.metric{font-size:26px;line-height:1;font-weight:700;color:var(--text);letter-spacing:-.04em}.metric.green{color:var(--green)}.note{border-left:2px solid var(--amber);background:var(--amberbg);padding:12px 14px;border-radius:0 8px 8px 0;color:#c5b58a;margin-top:16px}.subhead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:17px}.subhead p{margin:0;color:var(--muted);max-width:720px}.shield-wrap{display:grid;grid-template-columns:minmax(400px,1fr) 340px;gap:24px;align-items:center}.shield{width:min(620px,100%);margin:auto;aspect-ratio:1}.shield .arc{fill:none;stroke-linecap:round;cursor:pointer;transition:stroke-width .2s}.shield .arc:hover,.shield .arc.selected{stroke-width:26}.shield text{fill:var(--text);font-family:Inter,system-ui}.shield .small{fill:var(--muted);font-size:12px}.detail-panel{min-height:260px}.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;color:var(--muted);font-size:12px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.arch-controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filter.active{background:var(--greenbg);border-color:var(--green);color:var(--green)}.arch-scroller{border:1px solid var(--border);border-radius:10px;background:var(--bg2);overflow:auto;min-height:570px;resize:vertical}.diagram{min-width:1200px;padding:26px;transform-origin:top left;transition:transform .22s;display:grid;gap:20px}.lane{border:1px solid var(--border);border-radius:10px;padding:12px;background:#0f151c}.lane-head{font:600 11px ui-monospace,monospace;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;margin:0 0 10px}.nodes{display:flex;align-items:stretch;gap:10px}.node{width:155px;min-height:95px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;cursor:pointer;position:relative;text-align:left;color:var(--text)}.node:hover,.node.focused{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}.node .type{display:block;color:var(--dim);font-size:10px;margin-bottom:5px}.node .arr{position:absolute;right:-10px;top:40px;color:var(--green);z-index:2}.node.shared{border-style:dashed}.node.governance{border-color:#53606c}.node.hidden-layer{display:none}.arrowline{color:var(--dim);align-self:center;font-size:20px}.issue{display:grid;grid-template-columns:360px 1fr;gap:18px}.tree{padding:10px}.tree button{display:block;border:0;background:transparent;color:var(--neutral);text-align:left;width:100%;padding:7px 8px;border-radius:6px;cursor:pointer}.tree button:hover,.tree button.sel{background:var(--surface);color:var(--text)}.tree .level1{padding-left:24px}.tree .level2{padding-left:48px;color:var(--muted)}.tree .toggle{color:var(--green);margin-right:6px}.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid var(--border);padding:10px;text-align:left;vertical-align:top}.table th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.state{font:600 11px ui-monospace,monospace;color:var(--green);background:var(--greenbg);padding:3px 6px;border-radius:4px}.state.amber{color:var(--amber);background:var(--amberbg)}.directory-tools{display:flex;gap:10px;margin:12px 0}.directory{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.agent-card{cursor:pointer;transition:transform .14s}.agent-card:hover{transform:translateY(-2px);border-color:var(--green)}.agent-card .tag{color:var(--green);font-size:10px}.agent-card p{font-size:13px}.lifecycle{display:grid;grid-template-columns:220px 1fr;gap:22px}.steps{display:grid;gap:5px}.step{border:1px solid transparent;background:transparent;color:var(--muted);padding:9px;border-radius:7px;cursor:pointer;text-align:left}.step.active{background:var(--greenbg);border-color:var(--green);color:var(--text)}.step-num{color:var(--green);font-size:11px;margin-right:7px}.trace{min-height:250px}.threecol{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.threecol .card h3{font-size:13px}.rail{border:1px solid #53606c;background:#121a20;border-radius:10px;padding:18px}.rail .nodes{overflow:auto;padding-bottom:5px}.matrix td:nth-child(n+2){color:var(--muted)}.drawer{position:fixed;z-index:30;right:0;top:0;height:100%;width:min(480px,100vw);background:var(--bg2);border-left:1px solid var(--border);padding:25px;transform:translateX(101%);transition:transform .23s;overflow:auto;box-shadow:-20px 0 50px #0006}.drawer.open{transform:none}.drawer-close{float:right}.drawer h2{margin-top:36px}.drawer dt{font:600 11px ui-monospace,monospace;color:var(--dim);margin-top:15px;text-transform:uppercase}.drawer dd{margin:3px 0;color:var(--muted)}.hidden{display:none!important}.empty{color:var(--muted);padding:20px}.fullscreen .sidebar,.fullscreen .topbar{display:none}.fullscreen .app{display:block}.fullscreen main{display:block}.fullscreen .content{max-width:none;padding:20px}.fullscreen .arch-scroller{height:calc(100vh - 40px)}@media(max-width:950px){:root{--side:0px}.app{display:block}.sidebar{transform:translateX(-100%)}main{width:100%}.content{padding:28px 18px}.topbar{padding:0 18px}.crumb{display:none}.tools .btn:not(:last-child){display:none}.search{width:150px}.four,.directory{grid-template-columns:repeat(2,1fr)}.shield-wrap,.issue,.lifecycle{grid-template-columns:1fr}.shield{max-width:500px}}@media(max-width:600px){.four,.two,.threecol,.directory{grid-template-columns:1fr}.topbar{height:auto;min-height:58px}.tools{flex-wrap:wrap;justify-content:flex-end}.content{padding-top:24px}h1{font-size:38px}.arch-scroller{min-height:460px}}

<div class="app"><aside class="sidebar"><div class="brand"><strong>MONITOR COHORT</strong><span>ARCHITECTURE REFERENCE</span></div><nav class="nav" id="nav"><div class="nav-label">Architecture</div></nav></aside><main><header class="topbar"><div class="crumb">MONITOR COHORT / ARCHITECTURE</div><div class="tools"><input id="search" class="search" placeholder="Search architecture…" aria-label="Search architecture"><button class="btn" id="expand">Expand all</button><button class="btn" id="fit">Fit diagram</button><button class="btn" id="fullscreen">Fullscreen view</button></div></header><div class="content" id="content"></div></main></div>
<aside class="drawer" id="drawer" aria-label="Component details"><button class="btn drawer-close" onclick="closeDrawer()">Close</button><div id="drawerContent"></div></aside>
<script>
const sections=[['overview','Overview'],['shield','Infrastructure Shield'],['architecture','System Architecture'],['issues','GitHub Issue Hierarchy'],['directory','Agent Directory'],['lifecycle','Execution Lifecycle'],['rag','RAG and Knowledge Layer'],['workflow','Implementation and PR Workflow'],['assurance','Evaluation and Assurance'],['validation','Pre-Merge What-If Validation'],['governance','Deterministic Governance'],['explorer','Architecture Explorer']];
const agents=[
{id:'launcher',name:'Monitor Cohort Launcher',layer:'Planning',trigger:'Transformation run begins',input:'Monitor estate, infrastructure context, RAG evidence',ops:'Refresh inventory; identify categories; identify candidate gaps; define scope; create the issue hierarchy.',output:'Planned cohorts and GitHub issue hierarchy',next:'Orchestrator',code:'No',pr:'No',approve:'No'},
{id:'orchestrator',name:'Monitor Cohort Orchestrator',layer:'Coordination',trigger:'Planned cohort received',input:'Cohort plan and specialist findings',ops:'Dispatches the defined sequence, tracks completion, consolidates evidence and authorises controlled progression.',output:'Implementation plan or next controlled stage',next:'Specialists / Implementation Agent',code:'No',pr:'No',approve:'No'},
{id:'eligibility',name:'Monitor Eligibility Agent',layer:'Investigation',trigger:'Orchestrator dispatch',input:'Initial scope and ownership context',ops:'Checks environment, applicability, ownership, scope and priority as a second safeguard.',output:'Eligible / Not eligible / Requires clarification',next:'Orchestrator',code:'No',pr:'No',approve:'No'},
{id:'signal',name:'Monitor Signal & Noise Agent',layer:'Investigation',trigger:'Eligibility result',input:'Scoped monitor configuration and historical context',ops:'Investigates flapping, stale groups, weak queries, noisy thresholds and aggregation logic; separates noise from real recurring service problems.',output:'GitHub findings grouped by investigation scope',next:'Orchestrator',code:'No',pr:'No',approve:'No'},
{id:'notification',name:'Monitor Notification Quality Agent',layer:'Investigation',trigger:'Signal & Noise completion',input:'Current notification messages',ops:'Assesses clarity, resource identification, operational context, links, actionability and formatting.',output:'Current-versus-proposed message comparison',next:'Orchestrator',code:'No',pr:'No',approve:'No'},
{id:'routing',name:'Monitor Routing Migration Agent',layer:'Investigation',trigger:'Notification Quality completion',input:'Priority, destination, ownership and routing context',ops:'Checks routing consistency and documents recommendations in GitHub.',output:'Routing recommendation',next:'Orchestrator',code:'No',pr:'No — explicitly records findings only',approve:'No'},
{id:'historian',name:'Monitor Cohort Historian',layer:'Investigation',trigger:'Routing completion',input:'RAG evidence and historical records',ops:'Retrieves prior decisions, outcomes, architecture history and recurring patterns. Unknown is retained when evidence is unavailable.',output:'Source-grounded historical context',next:'Orchestrator',code:'No',pr:'No',approve:'No'},
{id:'implementation',name:'Monitor Implementation Agent',layer:'Implementation',trigger:'Consolidated plan',input:'Scoped implementation plan and evidence',ops:'Prepares IaC changes, delegates independent work where appropriate, and creates proposed changes in pull requests.',output:'GitHub pull requests',next:'Code Simplifier',code:'Yes',pr:'Yes',approve:'No'},
{id:'subagents',name:'Parallel Implementation Sub-Agents',layer:'Implementation',trigger:'Independent scoped work',input:'Bounded task assignments',ops:'Implement P1/P2, SSL/synthetic, query, threshold, notification or routing corrections where independent.',output:'Proposed code contributions',next:'Implementation Agent',code:'Yes',pr:'No',approve:'No'},
{id:'simplifier',name:'Code Simplifier',layer:'Implementation',trigger:'Proposed change available',input:'Pull-request changes',ops:'Reduces unnecessary complexity while preserving required monitor behaviour and intended semantics.',output:'Simplified proposed configuration',next:'GitHub Copilot PR Reviewer',code:'Yes',pr:'No',approve:'No'},
{id:'reviewer',name:'GitHub Copilot PR Reviewer',layer:'Assurance',trigger:'PR ready for review',input:'Pull request',ops:'Identifies implementation, query, consistency and complexity findings.',output:'Review findings',next:'Minor-Fix Agent or validation',code:'No',pr:'No',approve:'No'},
{id:'minorfix',name:'Automated Minor-Fix Agent',layer:'Assurance',trigger:'Bounded actionable review finding',input:'Review comments',ops:'Applies minor corrections, updates the PR and requests another review. Significant or ambiguous work is escalated.',output:'Updated PR',next:'GitHub Copilot PR Reviewer',code:'Yes — bounded changes only',pr:'Updates existing PR',approve:'No'},
{id:'validationagent',name:'Monitor Live Validation Agent',layer:'Assurance',trigger:'PR review satisfactory',input:'Current config, proposed PR config, historical Datadog data',ops:'Performs pre-merge what-if analysis; compares current and predicted future behaviour and presents limitations.',output:'Validation evidence and review recommendation',next:'Closer Audit',code:'No',pr:'No',approve:'No'},
{id:'audit',name:'Monitor Closer Audit',layer:'Assurance',trigger:'Validation evidence available',input:'Acceptance criteria, issues, findings and evidence',ops:'Checks original scope, evidence and unresolved issues. Code review, behavioural validation and criteria completion remain separate gates.',output:'Ready / unresolved audit outcome',next:'Human approval',code:'No',pr:'No',approve:'No'}];
const nav=document.getElementById('nav');nav.innerHTML+=[...sections].map(([id,n])=>`<a href="#${id}">${n}</a>`).join('');
const agentById=Object.fromEntries(agents.map(a=>[a.id,a]));
function agentCard(a){return `<article class="card agent-card searchable" tabindex="0" data-agent="${a.id}" data-search="${a.name} ${a.layer} ${a.ops}"><div class="tag">${a.layer.toUpperCase()}</div><h3>${a.name}</h3><p>${a.output}</p></article>`}
function node(id,label,type,cls=''){return `<button class="node ${cls}" data-agent="${id}"><span class="type">${type}</span>${label}</button>`}
const content=document.getElementById('content');content.innerHTML=`
<section id="overview"><div class="eyebrow">Architecture reference · static model</div><h1>Monitoring,<br>Re-engineered.</h1><p class="lead">An AI-assisted monitoring lifecycle combining multi-agent orchestration, enterprise knowledge retrieval, deterministic assurance and human-controlled production changes.</p><div class="grid four" style="margin-top:30px"><div class="card"><div class="metric">200+</div><h3>Monitoring estate</h3><p>Monitors in scope for consistent coverage, classification, routing and governance.</p></div><div class="card"><div class="metric green">~90%</div><h3>Monitoring improvement</h3><p>Reported reduction in alert volume across the transformation.</p></div><div class="card"><div class="metric">100%</div><h3>Infrastructure as code</h3><p>All in-scope monitors brought under infrastructure-as-code management.</p></div><div class="card"><div class="metric">Human</div><h3>Governance model</h3><p>AI-assisted preparation, automated engineering checks and accountable service-team approval.</p></div></div><div class="note">Project claims shown here are supplied architectural context, not independently validated metrics.</div><div class="card" style="margin-top:18px"><h3>The engineering problem</h3><p>Inconsistent coverage · incorrect aggregation formulas · weak queries · poorly calibrated thresholds · flapping alerts · stale monitor groups · fragmented notification routing · manual configuration · IaC drift · excessive on-call notifications · reduced visibility of genuinely critical incidents.</p><p style="margin-top:12px">An illustrative operational consequence described by the project owner: a public-facing production certificate remained expired for approximately three hours. No company or confidential infrastructure is identified here.</p></div></section>
<section id="shield"><div class="subhead"><div><div class="eyebrow">Conceptual coverage model</div><h2>Infrastructure Shield</h2><p>A conceptual architecture analogy, not a measured coverage map. Select an arc to inspect how the workflow responds.</p></div></div><div class="shield-wrap"><svg class="shield" viewBox="0 0 620 620" role="img" aria-label="Production infrastructure with conceptual monitoring coverage shield"><circle cx="310" cy="310" r="184" fill="#151B23" stroke="#30363D" stroke-width="1"/><circle cx="310" cy="310" r="114" fill="#1C232D" stroke="#30363D"/><path class="arc" data-shield="existing" d="M 137 213 A 200 200 0 0 1 298 110" stroke="#3FB950" stroke-width="19"/><path class="arc" data-shield="existing" d="M 328 111 A 200 200 0 0 1 492 228" stroke="#3FB950" stroke-width="19"/><path class="arc" data-shield="gap" d="M 509 260 A 200 200 0 0 1 494 349" stroke="#D29922" stroke-width="19" stroke-dasharray="7 7"/><path class="arc" data-shield="existing" d="M 470 408 A 200 200 0 0 1 355 500" stroke="#3FB950" stroke-width="19"/><path class="arc" data-shield="noisy" d="M 296 510 A 200 200 0 0 1 165 445" stroke="#9199A4" stroke-width="19" stroke-dasharray="2 6"/><path class="arc" data-shield="gap" d="M 135 405 A 200 200 0 0 1 111 322" stroke="#D29922" stroke-width="19" stroke-dasharray="7 7"/><text x="310" y="294" text-anchor="middle" font-size="20" font-weight="650">Production</text><text x="310" y="321" text-anchor="middle" font-size="20" font-weight="650">Infrastructure</text><text class="small" x="310" y="350" text-anchor="middle">applications · cloud · network · certificates</text><text class="small" x="310" y="369" text-anchor="middle">endpoints · processing · data services</text></svg><div class="card detail-panel" id="shieldDetail"><div class="eyebrow">Select a segment</div><h3>Coverage as a system concern</h3><p>Select a green, amber or patterned segment in the ring. The detail panel will explain the conceptual relationship to the Monitor Cohort workflow.</p><div class="legend"><span><i style="background:#3FB950"></i>Existing coverage</span><span><i style="background:#D29922"></i>Coverage gap</span><span><i style="background:#9199A4"></i>Potentially redundant/noisy</span></div></div></div></section>
<section id="architecture"><div class="subhead"><div><div class="eyebrow">End-to-end system</div><h2>System Architecture</h2><p>Ordered swimlanes make dispatch, feedback, knowledge access and release controls readable without implying live integrations.</p></div></div><div class="arch-controls"><button class="btn filter active" data-layer="all">All layers</button><button class="btn filter" data-layer="Planning">Planning</button><button class="btn filter" data-layer="Investigation">Investigation</button><button class="btn filter" data-layer="Implementation">Implementation</button><button class="btn filter" data-layer="Assurance">Assurance</button><button class="btn filter" data-layer="Shared">Shared knowledge</button><button class="btn filter" data-layer="Governance">Governance</button></div><div class="arch-scroller" id="archScroller"><div class="diagram" id="diagram"><div class="lane" data-lane="Planning"><div class="lane-head">01 / Planning</div><div class="nodes">${node('launcher','Monitor Cohort<br>Launcher','PLANNING')}<span class="arrowline">→</span>${node('orchestrator','Monitor Cohort<br>Orchestrator','COORDINATION')}</div></div><div class="lane" data-lane="Investigation"><div class="lane-head">02 / Specialist investigation · each result returns to orchestrator</div><div class="nodes">${node('eligibility','Eligibility','SPECIALIST')}<span class="arrowline">→</span>${node('signal','Signal & Noise','SPECIALIST')}<span class="arrowline">→</span>${node('notification','Notification Quality','SPECIALIST')}<span class="arrowline">→</span>${node('routing','Routing Migration','SPECIALIST')}<span class="arrowline">→</span>${node('historian','Cohort Historian','SPECIALIST')}</div></div><div class="lane" data-lane="Shared"><div class="lane-head">Shared systems · dashed access relationships</div><div class="nodes">${node('rag','Hybrid RAG MCP','SHARED','shared')} ${node('github','GitHub issues / repositories / PRs','SHARED','shared')} ${node('datadog','Datadog','SHARED','shared')}<div class="card" style="margin-left:12px;max-width:310px"><span class="type">RELATIONSHIP LEGEND</span><p>Solid: ordered execution · dashed: shared knowledge access · dotted: feedback or audit reporting.</p></div></div></div><div class="lane" data-lane="Implementation"><div class="lane-head">03 / Implementation · proposed changes only</div><div class="nodes">${node('implementation','Implementation Agent','IMPLEMENTATION')}<span class="arrowline">→</span>${node('subagents','Parallel sub-agents','OPTIONAL BRANCH')}<span class="arrowline">→</span>${node('simplifier','Code Simplifier','REVIEW')}</div></div><div class="lane" data-lane="Assurance"><div class="lane-head">04 / Validation, assurance and controlled release</div><div class="nodes">${node('reviewer','Copilot PR Reviewer','PR REVIEW')}<span class="arrowline">↔</span>${node('minorfix','Minor-Fix Agent','BOUNDED LOOP')}<span class="arrowline">→</span>${node('validationagent','Live Validation','PRE-MERGE')}<span class="arrowline">→</span>${node('audit','Closer Audit','ASSURANCE')}<span class="arrowline">→</span>${node('human','Human approval','ACCOUNTABLE')}<span class="arrowline">→</span>${node('deploy','Automatic deployment<br>+ rollback','RELEASE')}</div></div><div class="lane" data-lane="Governance"><div class="lane-head">Independent deterministic governance · not an LLM agent or remediation creator</div><div class="nodes">${node('governance','Monthly retrospective runbook','DETERMINISTIC','governance')}<span class="arrowline">→</span>${node('drift','Golden rules · drift checks · audit findings','DETERMINISTIC','governance')}</div></div></div></div></section>
<section id="issues"><div class="subhead"><div><div class="eyebrow">Launcher output</div><h2>GitHub Issue Hierarchy</h2><p>Illustrative scope categories; no real issue identifiers or URLs are used.</p></div></div><div class="issue"><div class="card tree" id="tree"><button class="sel" data-issue="epic"><span class="toggle">⌄</span><b>MONITORING REVAMP EPIC</b></button><button class="level1" data-issue="p1"><span class="toggle">⌄</span>P1 Priority Issue</button><button class="level2 child p1" data-issue="ssl">SSL / TLS certificate monitors</button><button class="level2 child p1" data-issue="synthetic">Synthetic SSL monitors</button><button class="level2 child p1" data-issue="critical">Critical resource monitors</button><button class="level1" data-issue="p2"><span class="toggle">⌄</span>P2 Priority Issue</button><button class="level2 child p2" data-issue="resource">Resource monitors</button><button class="level2 child p2" data-issue="logs">Log monitors</button><button class="level1" data-issue="p3">› P3 Priority Issue</button><button class="level2 child p3" data-issue="scopes">Monitor-specific scopes</button><button class="level1" data-issue="p4">› P4 Priority Issue</button></div><div class="card" id="issueDetail"><div class="eyebrow">Selected node</div><h3>MONITORING REVAMP EPIC</h3><table class="table"><tr><th>Priority</th><td>Programme-level</td></tr><tr><th>Scope</th><td>Central planning and issue structure</td></tr><tr><th>Objective</th><td>Establish coherent, monitor-specific work scopes.</td></tr><tr><th>Workflow component</th><td>Monitor Cohort Launcher</td></tr><tr><th>Eligibility</th><td><span class="state amber">Pending validation</span></td></tr><tr><th>Findings</th><td><span class="state amber">Not yet investigated</span></td></tr></table></div></div></section>
<section id="directory"><div class="subhead"><div><div class="eyebrow">Searchable component reference</div><h2>Agent Directory</h2><p>Open any card for trigger, inputs, permitted actions and next destination.</p></div></div><div class="directory-tools"><input id="dirSearch" class="search" placeholder="Filter agents…" aria-label="Filter agents"><button class="btn" data-dir-filter="all">All</button><button class="btn" data-dir-filter="Investigation">Investigation</button><button class="btn" data-dir-filter="Implementation">Implementation</button><button class="btn" data-dir-filter="Assurance">Assurance</button></div><div class="directory" id="directoryCards">${agents.map(agentCard).join('')}<article class="card"><div class="tag">NON-AGENT</div><h3>Shared and control components</h3><p>Hybrid RAG MCP · GitHub Issues · GitHub repositories · Datadog · CI/CD · Human approval · Monthly deterministic audit.</p></article></div></section>
<section id="lifecycle"><div class="subhead"><div><div class="eyebrow">Conceptual execution trace</div><h2>Execution Lifecycle</h2><p>Click a stage, or move through the lifecycle. This is an architecture simulation, not a production execution log.</p></div></div><div class="lifecycle"><div><div class="steps" id="steps"></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" id="prev">Previous</button><button class="btn" id="next">Next</button></div></div><div class="card trace" id="trace"></div></div></section>
<section id="rag"><div class="subhead"><div><div class="eyebrow">Shared knowledge layer</div><h2>RAG and Knowledge Layer</h2><p>Supporting evidence for multiple components; it does not autonomously create monitoring changes.</p></div></div><div class="card"><div class="nodes" style="overflow:auto"><div class="node">Query</div><span class="arrowline">→</span><div class="node">Hybrid retrieval</div><span class="arrowline">→</span><div class="node">Candidate evidence</div><span class="arrowline">→</span><div class="node">Ranked context</div><span class="arrowline">→</span><div class="node">Source-grounded response</div></div><div class="grid four" style="margin-top:18px"><div><h3>Logical sources</h3><p>Relevant repositories, documentation, configurations, runbooks, architecture information and available historical records.</p></div><div><h3>First access</h3><p>The Launcher queries RAG during initial planning; the Historian explicitly retrieves decisions and outcomes later.</p></div><div><h3>Evidence boundary</h3><p>Consuming agents and reviewers see source citations or references. Missing evidence remains unknown or unverified.</p></div><div><h3>Benefit</h3><p>Organisational grounding, traceability and reduced reliance on model memory.</p></div></div></div></section>
<section id="workflow"><div class="subhead"><div><div class="eyebrow">Proposed changes · not direct production modification</div><h2>Implementation and PR Workflow</h2></div></div><div class="grid two"><div class="card"><h3>Controlled implementation</h3><p>Following consolidated planning, the Implementation Agent may delegate appropriately independent scoped work. Branches converge into proposed infrastructure-as-code changes and GitHub pull requests.</p><p>Code Simplifier follows implementation and preserves intended monitor behaviour.</p></div><div class="card"><h3>Bounded correction loop</h3><p class="mono" style="color:var(--green)">PR Review → Findings → Minor-Fix Agent → Updated PR → PR Review</p><p>Significant or ambiguous findings require escalation or human judgement. Automated review is not final approval.</p></div></div></section>
<section id="validation"><div class="subhead"><div><div class="eyebrow">Evidence before approval</div><h2>Pre-Merge What-If Validation</h2><p>Monitor Live Validation evaluates proposed configuration against live configuration and historical data while code remains in the pull request.</p></div></div><div class="threecol"><div class="card"><div class="eyebrow">Current state</div><h3>Existing live monitor configuration</h3><p>Illustrative threshold: <code>5 errors</code>. The live state provides a baseline for comparison.</p></div><div class="card"><div class="eyebrow">Proposed state</div><h3>PR configuration</h3><p>Illustrative threshold: <code>10 errors</code>. This is proposed code, not deployed configuration.</p></div><div class="card"><div class="eyebrow">Simulated state</div><h3>Predicted behaviour</h3><p>What-if comparison over the same historical period. Evidence identifies expected alert behaviour and potential critical-detection risk.</p></div></div><div class="note">Simulation is evidence for human approval, not a guarantee of future production performance. The report records assumptions, limitations, supporting evidence, potentially suppressed notifications and a recommendation for review.</div></section>
<section id="assurance"><div class="subhead"><div><div class="eyebrow">Quality gates</div><h2>Evaluation and Assurance</h2><p>Qualitative illustrative cases only. Acceptance thresholds are defined per use case.</p></div></div><div class="card"><table class="table matrix"><thead><tr><th>Evaluation area</th><th>What is checked</th><th>Illustrative status</th></tr></thead><tbody><tr><td>Representative scenarios</td><td>Configuration, quality, routing, eligibility, scope and expected outcomes</td><td>Defined per use case</td></tr><tr><td>Agent trajectory</td><td>Correct sequence, appropriate tools and task boundaries</td><td>Defined per use case</td></tr><tr><td>Tool-call evaluation</td><td>Appropriate tool selection and parameters</td><td>Defined per use case</td></tr><tr><td>Task outcome</td><td>Proposed configuration satisfies the required task</td><td>Defined per use case</td></tr><tr><td>Repeated & regression trials</td><td>Reliability, variability and protection of working scenarios</td><td>Defined per use case</td></tr><tr><td>RAG grounding</td><td>Evidence relevance, citation quality and conclusion support</td><td>Defined per use case</td></tr></tbody></table></div><div class="grid four" style="margin-top:14px"><div class="card"><h3>1. Code review</h3><p>Findings addressed through bounded loop.</p></div><div class="card"><h3>2. Behavioural validation</h3><p>What-if evidence before merge.</p></div><div class="card"><h3>3. Criteria completion</h3><p>Closer Audit checks original scope.</p></div><div class="card"><h3>4. Human approval</h3><p>Responsible service team is accountable.</p></div></div></section>
<section id="governance"><div class="subhead"><div><div class="eyebrow">Independent assurance rail</div><h2>Deterministic Governance</h2><p>Monthly retrospective runbook — separate from the multi-agent chain and not an LLM.</p></div></div><div class="rail"><div class="nodes">${node('governance','Check existing monitors','MONTHLY','governance')}<span class="arrowline">→</span>${node('rules','Validate golden rules','DETERMINISTIC','governance')}<span class="arrowline">→</span>${node('drift','Detect configuration drift','DETERMINISTIC','governance')}<span class="arrowline">→</span>${node('findings','Report compliance & audit findings','REPORT ONLY','governance')}</div><p style="color:var(--muted);margin:14px 0 0">This automation checks standards, IaC deviation and drift, then highlights monitors that require investigation or remediation. It does not autonomously create remediation pull requests.</p></div></section>
<section id="explorer"><div class="subhead"><div><div class="eyebrow">Interaction guide</div><h2>Architecture Explorer</h2><p>The architecture diagram above is the explorer canvas. Select a node to inspect it, use layer filters to simplify it, use fit-to-view, or enter fullscreen mode.</p></div></div><div class="grid two"><div class="card"><h3>Relationship inspection</h3><p>Key relationship types include GitHub issue scope, eligibility decision, signal-quality finding, routing recommendation, historical context, implementation plan, proposed code, review finding, validation evidence and approval decision.</p></div><div class="card"><h3>Internal navigation</h3><p>Every left-navigation item and section URL fragment links directly to its architecture reference section. Search finds agents and concepts across the page.</p></div></div></section>`;
const shieldCopy={gap:['Coverage gap','Missing visibility matters because a service, resource or endpoint can fail without a reliable signal. The Launcher identifies candidate coverage areas, Eligibility confirms whether monitoring applies, and approved implementation work later addresses the gap.'],existing:['Existing coverage','Existing monitors are assessed for signal quality, routing, infrastructure-as-code ownership and ongoing compliance. Coverage is not treated as permanently sufficient just because a monitor exists.'],noisy:['Potentially redundant or noisy coverage','A patterned segment represents coverage that may be noisy or redundant. Signal & Noise investigates configuration quality without suppressing legitimate incidents.']};
document.querySelectorAll('[data-shield]').forEach(el=>el.addEventListener('click',()=>{document.querySelectorAll('[data-shield]').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');const [h,p]=shieldCopy[el.dataset.shield];document.getElementById('shieldDetail').innerHTML=`<div class="eyebrow">${el.dataset.shield}</div><h3>${h}</h3><p>${p}</p><div class="legend"><span><i style="background:#3FB950"></i>Existing coverage</span><span><i style="background:#D29922"></i>Coverage gap</span></div>`}));
function openDrawer(a){if(!a){return}document.getElementById('drawerContent').innerHTML=`<div class="eyebrow">${a.layer}</div><h2>${a.name}</h2><dl><dt>Trigger</dt><dd>${a.trigger}</dd><dt>Input</dt><dd>${a.input}</dd><dt>Core operations</dt><dd>${a.ops}</dd><dt>Output</dt><dd>${a.output}</dd><dt>Next destination</dt><dd>${a.next}</dd><dt>May modify code?</dt><dd>${a.code}</dd><dt>May create a pull request?</dt><dd>${a.pr}</dd><dt>May approve production changes?</dt><dd>${a.approve}</dd></dl>`;document.getElementById('drawer').classList.add('open')};function closeDrawer(){document.getElementById('drawer').classList.remove('open')};window.closeDrawer=closeDrawer;
document.addEventListener('click',e=>{const x=e.target.closest('[data-agent]');if(x){const id=x.dataset.agent;const a=agentById[id]||({rag:{name:'Hybrid RAG MCP',layer:'Shared knowledge',trigger:'Context requested',input:'Queries from approved workflow components',ops:'Provides hybrid retrieval, candidate evidence, ranked context and source-grounded responses.',output:'Cited context',next:'Requesting component',code:'No',pr:'No',approve:'No'},github:{name:'GitHub',layer:'Shared system',trigger:'Workflow update',input:'Scopes, findings and proposed changes',ops:'Hosts issue hierarchy, comments, repositories and pull requests.',output:'Traceable engineering record',next:'Workflow component',code:'N/A',pr:'N/A',approve:'No'},datadog:{name:'Datadog',layer:'Shared system',trigger:'Investigation or validation',input:'Monitor configuration and historical data',ops:'Supplies current configuration and historical monitoring evidence.',output:'Monitoring evidence',next:'Requesting component',code:'No',pr:'No',approve:'No'},human:{name:'Human PR Approval',layer:'Accountable control',trigger:'Closer Audit outcome',input:'PR, review and validation evidence',ops:'Responsible service team makes final production-impacting approval decision.',output:'Approved merge decision',next:'Automatic deployment',code:'No',pr:'Approves PR',approve:'Yes'},deploy:{name:'Automatic Deployment',layer:'Release',trigger:'Approved merge',input:'Merged configuration',ops:'GitHub-based automation deploys approved configuration; rollback capability is available.',output:'Released configuration',next:'Ongoing governance',code:'No',pr:'No',approve:'No'},governance:{name:'Monthly Retrospective Runbook',layer:'Deterministic governance',trigger:'Monthly schedule',input:'Existing monitors, standards and IaC declarations',ops:'Checks golden rules, drift and compliance. It reports findings only.',output:'Compliance and audit findings',next:'Engineering investigation',code:'No',pr:'No',approve:'No'},drift:{name:'Configuration Drift Checks',layer:'Deterministic governance',trigger:'Monthly runbook',input:'Declared and observed configuration',ops:'Identifies deviations for reporting.',output:'Audit finding',next:'Engineering investigation',code:'No',pr:'No',approve:'No'},rules:{name:'Golden-rule Compliance Checks',layer:'Deterministic governance',trigger:'Monthly runbook',input:'Configuration standards',ops:'Validates required monitoring standards.',output:'Compliance result',next:'Audit findings',code:'No',pr:'No',approve:'No'},findings:{name:'Audit Findings',layer:'Deterministic governance',trigger:'Checks completed',input:'Compliance results',ops:'Reports monitors requiring investigation or remediation.',output:'Report',next:'Human-directed work',code:'No',pr:'No',approve:'No'}}[id]);openDrawer(a)}});
const issues={epic:['MONITORING REVAMP EPIC','Programme-level','Central planning and issue structure','Establish coherent monitor-specific work scopes.','Monitor Cohort Launcher'],p1:['P1 Priority Issue','P1','Illustrative critical monitoring scopes','Prioritise critical monitor categories.','Launcher → Eligibility'],p2:['P2 Priority Issue','P2','Illustrative resource and log monitor scopes','Group planned work by priority.','Launcher → Eligibility'],p3:['P3 Priority Issue','P3','Monitor-specific scopes','Refine lower priority planned work.','Launcher → Eligibility'],p4:['P4 Priority Issue','P4','Monitor-specific scopes','Refine lower priority planned work.','Launcher → Eligibility'],ssl:['SSL / TLS certificate monitors','P1','Example scope category','Address approved certificate-monitoring scope.','Specialist workflow'],synthetic:['Synthetic SSL monitors','P1','Example scope category','Address approved synthetic SSL monitoring scope.','Specialist workflow'],critical:['Critical resource monitors','P1','Example scope category','Address approved critical resource scope.','Specialist workflow'],resource:['Resource monitors','P2','Example scope category','Address approved resource monitoring scope.','Specialist workflow'],logs:['Log monitors','P2','Example scope category','Address approved log monitoring scope.','Specialist workflow'],scopes:['Monitor-specific scopes','P3','Illustrative scoped work','Define monitor-specific work.','Launcher → Orchestrator']};
document.querySelectorAll('[data-issue]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-issue]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');const d=issues[b.dataset.issue];document.getElementById('issueDetail').innerHTML=`<div class="eyebrow">Selected node · illustrative</div><h3>${d[0]}</h3><table class="table"><tr><th>Priority</th><td>${d[1]}</td></tr><tr><th>Scope</th><td>${d[2]}</td></tr><tr><th>Objective</th><td>${d[3]}</td></tr><tr><th>Workflow component</th><td>${d[4]}</td></tr><tr><th>Eligibility</th><td><span class="state amber">Pending validation</span></td></tr><tr><th>Findings</th><td><span class="state amber">Not yet investigated</span></td></tr></table>`}));
const stages=[['Planning','Monitor Cohort Launcher','Inventory, categories, infrastructure context and RAG evidence','Creates the central GitHub issue hierarchy and initial monitor-specific scopes.','Planned cohorts','Eligibility'],['Eligibility','Monitor Eligibility Agent','Initial scope and ownership context','Second validation of applicability, ownership, scope and priority.','Eligible / not eligible / clarification','Signal & Noise'],['Signal & Noise','Monitor Signal & Noise Agent','Scoped monitor configuration','Reports flapping, stale group, weak-query and noisy-threshold findings into GitHub.','Investigation findings','Notification Quality'],['Notification Quality','Monitor Notification Quality Agent','Current notification messages','Compares current and proposed messages for actionability and context.','Before/after comparison','Routing Migration'],['Routing Migration','Monitor Routing Migration Agent','Priority, destination and ownership','Documents routing recommendations in GitHub; it does not create a PR.','Routing recommendation','Historian'],['Historian','Monitor Cohort Historian','Hybrid RAG evidence and historical records','Retrieves source-grounded decisions and outcomes; unknown remains unverified.','Historical context','Implementation Planning'],['Implementation Planning','Monitor Cohort Orchestrator','Specialist findings and historical context','Consolidates evidence and determines whether implementation can be planned.','Scoped implementation plan','Parallel Implementation'],['Parallel Implementation','Monitor Implementation Agent','Approved implementation plan','Delegates independent bounded work where appropriate; proposed code converges in PRs.','Proposed pull requests','Code Simplification'],['Code Simplification','Code Simplifier','Proposed code','Reduces unnecessary complexity without changing monitor semantics.','Simplified PR','PR Review'],['PR Review','GitHub Copilot PR Reviewer','Pull request','Produces review findings; bounded corrections may enter the Minor-Fix Loop.','Review findings','Minor-Fix Loop / Validation'],['Minor-Fix Loop','Automated Minor-Fix Agent','Minor actionable comments','Applies bounded corrections, updates PR, and returns it for another review.','Updated PR','PR Review'],['Pre-Merge What-If Validation','Monitor Live Validation Agent','Live config, PR config and historical Datadog data','Compares current and predicted behaviour; records limitations and risks.','Validation evidence','Closer Audit'],['Closer Audit','Monitor Closer Audit','Acceptance criteria, issues and evidence','Confirms scope, evidence and outstanding findings are addressed.','Audit outcome','Human Approval'],['Human Approval','Responsible service team','PR, validation and audit evidence','Accountable final approval for the production-impacting change.','Approved merge','Automated Deployment'],['Automated Deployment','GitHub-based automation','Approved merged configuration','Deploys approved configuration; rollback capability is available.','Released configuration','Monthly governance']];let current=0;const steps=document.getElementById('steps');function drawSteps(){steps.innerHTML=stages.map((s,i)=>`<button class="step ${i===current?'active':''}" data-stage="${i}"><span class="step-num">${String(i+1).padStart(2,'0')}</span>${s[0]}</button>`).join('');document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{current=+b.dataset.stage;drawSteps();drawTrace()})}function drawTrace(){const s=stages[current];document.getElementById('trace').innerHTML=`<div class="eyebrow">Stage ${String(current+1).padStart(2,'0')} / ${s[0]}</div><h2>${s[1]}</h2><div class="grid two" style="margin-top:20px"><div><h3>Input</h3><p>${s[2]}</p><h3 style="margin-top:18px">Action</h3><p>${s[3]}</p></div><div><h3>Output</h3><p>${s[4]}</p><h3 style="margin-top:18px">Next</h3><p>${s[5]}</p><h3 style="margin-top:18px">GitHub / RAG</h3><p>${s[0]==='Planning'||s[0]==='Historian'?'RAG interaction; GitHub traceability.':s[0].includes('Implementation')||s[0].includes('Review')||s[0].includes('Fix')?'GitHub pull-request workflow.':'Context used where applicable; stage evidence remains traceable.'}</p></div></div>`}drawSteps();drawTrace();document.getElementById('prev').onclick=()=>{current=(current+stages.length-1)%stages.length;drawSteps();drawTrace()};document.getElementById('next').onclick=()=>{current=(current+1)%stages.length;drawSteps();drawTrace()};
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');const l=b.dataset.layer;document.querySelectorAll('[data-lane]').forEach(x=>x.classList.toggle('hidden-layer',l!=='all'&&x.dataset.lane!==l))});let fit=1;document.getElementById('fit').onclick=()=>{const sc=document.getElementById('archScroller'),d=document.getElementById('diagram');fit=fit===1?Math.min(1,(sc.clientWidth-40)/1200):1;d.style.transform=`scale(${fit})`;d.style.marginBottom=fit<1?`${-(1-fit)*570}px`:''};document.getElementById('fullscreen').onclick=()=>{document.body.classList.toggle('fullscreen');setTimeout(()=>document.getElementById('fit').click(),50)};let expanded=true;document.getElementById('expand').onclick=e=>{expanded=!expanded;document.querySelectorAll('.child').forEach(x=>x.classList.toggle('hidden',!expanded));e.target.textContent=expanded?'Collapse all':'Expand all'};
function doSearch(q){q=q.trim().toLowerCase();document.querySelectorAll('.searchable,.agent-card').forEach(el=>{const hit=!q||(el.dataset.search||el.textContent).toLowerCase().includes(q);el.classList.toggle('hidden',!hit)});document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('hidden',q&&!a.textContent.toLowerCase().includes(q)&&!document.getElementById(a.getAttribute('href').slice(1)).textContent.toLowerCase().includes(q)))}document.getElementById('search').oninput=e=>doSearch(e.target.value);document.getElementById('dirSearch').oninput=e=>{document.querySelectorAll('#directoryCards .agent-card').forEach(x=>x.classList.toggle('hidden',!x.textContent.toLowerCase().includes(e.target.value.toLowerCase())))};document.querySelectorAll('[data-dir-filter]').forEach(b=>b.onclick=()=>{const f=b.dataset.dirFilter;document.querySelectorAll('#directoryCards .agent-card').forEach(x=>x.classList.toggle('hidden',f!=='all'&&!x.textContent.includes(f)))});
const observer=new IntersectionObserver(entries=>entries.forEach(x=>{if(x.isIntersecting){document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+x.target.id))}}),{rootMargin:'-30% 0px -60%'});sections.forEach(([id])=>observer.observe(document.getElementById(id)));
</script></body></html>
